# Native tests (ctest), the WebAssembly build (web/build.sh) and its tests (web/test.mjs) on every
# pull request and every push to main. A v* tag on a commit that is on main also publishes
# pricer.mjs, pricer.wasm, BUILD.txt and SHA256SUMS as a release.
name: WebAssembly

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  EMSDK_VERSION: 6.0.13 # the version in the README; changing it changes the artefact
  EMSDK_COMMIT: 35659964bc2762fffec0d257997fb61475f765b7 # emsdk's tag 6.0.13; a tag can be moved, a commit cannot

jobs:
  build:
    # arm64 with Apple clang and libc++, the toolchain of the README's measurements; web/test.mjs
    # compares the WebAssembly module's results with the native build's (web_driver)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Native build and tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure

      - name: Install Emscripten
        run: |
          git init -q "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          git fetch -q --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_COMMIT"
          git checkout -q FETCH_HEAD
          head=$(git rev-parse HEAD)
          echo "emsdk at $head"
          [ "$head" = "$EMSDK_COMMIT" ]
          ./emsdk install "$EMSDK_VERSION"
          ./emsdk activate "$EMSDK_VERSION"

      - name: Build the WebAssembly module
        env:
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }} # a pull request's head, not GitHub's merge
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          web/build.sh

      - name: Tests of the WebAssembly module
        run: |
          node --version # the runner's (emsdk_env.sh leaves a Node already on PATH first)
          node web/test.mjs build/web_driver

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pricer-wasm
          path: web/dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so origin/main is there to compare with
          persist-credentials: false

      - name: Require the tagged commit to be on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main; nothing is published"
            exit 1
          }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pricer-wasm
          path: dist

      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/pricer.mjs dist/pricer.wasm dist/BUILD.txt dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --notes "WebAssembly build of the Black-Scholes pricer: closed form and Greeks, implied volatility and Monte Carlo (web/build.sh, Emscripten $EMSDK_VERSION); see BUILD.txt. Check the files with: sha256sum -c SHA256SUMS"
